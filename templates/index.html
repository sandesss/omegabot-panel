<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omega Admin Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #38bdf8; text-align: center; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #1e293b;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th { background-color: #0284c7; color: white; }
        .btn {
            padding: 6px 12px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
        }
        .btn-clear { background-color: #dc2626; }
        .btn-clear:hover { background-color: #b91c1c; }
        .btn-fix { background-color: #16a34a; }
        .btn-fix:hover { background-color: #15803d; }
    </style>
</head>
<body>

    <h1>Omega Admin Panel - User Management</h1>
    
    <table>
        <thead>
            <tr>
                <th>HWID</th>
                <th>IP Address</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="user-table-body">
            <tr><td colspan="4" style="text-align: center;">Loading users from Firebase...</td></tr>
        </tbody>
    </table>

    <script>
        async function fetchUsers() {
            try {
                const response = await fetch('/api/users');
                const users = await response.json();
                const tbody = document.getElementById('user-table-body');
                tbody.innerHTML = '';

                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">No users found.</td></tr>';
                    return;
                }

                users.forEach(user => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${user.hwid || 'No HWID'}</td>
                        <td>${user.ip || 'N/A'}</td>
                        <td>${user.status || 'Active'}</td>
                        <td>
                            <button class="btn btn-clear" onclick="clearUser('${user.id}')">Clear</button>
                            <button class="btn btn-fix" onclick="fixUser('${user.id}')">Fix</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Error fetching users:", error);
            }
        }

        async function clearUser(userId) {
            if (confirm("Are you sure you want to clear this user's HWID?")) {
                const res = await fetch(`/api/clear/${userId}`, { method: 'POST' });
                if (res.ok) {
                    fetchUsers();
                } else {
                    alert("Failed to clear user.");
                }
            }
        }

        async function fixUser(userId) {
            const res = await fetch(`/api/fix/${userId}`, { method: 'POST' });
            if (res.ok) {
                fetchUsers();
            } else {
                alert("Failed to fix user.");
            }
        }

        fetchUsers();
    </script>

</body>
</html>
